```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskGroup</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>

<body>

<div class="container">

    <header>
        <h1>👥 TaskGroup</h1>
        <p>Pembagian Tugas Kelompok</p>
    </header>

    <div class="info">
        <input id="groupName" placeholder="Nama Kelompok">
        <input id="courseName" placeholder="Mata Kuliah">
    </div>

    <div class="form">
        <input id="member" placeholder="Nama anggota">
        <input id="task" placeholder="Tugas">
        <button onclick="addTask()">+ Tambah</button>
    </div>

    <div id="taskList"></div>

</div>

<script src="app.js"></script>

</body>
</html>
